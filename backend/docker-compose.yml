version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: mundos-papel-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: mundos-de-papel
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mundos-papel-network

  # Backend API
  backend:
    build: .
    container_name: mundos-papel-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/mundos-de-papel?authSource=admin
      JWT_SECRET: tu_clave_secreta_super_segura_cambiame_en_produccion
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - mundos-papel-network
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongodb_data:

networks:
  mundos-papel-network:
    driver: bridge
